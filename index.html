<!DOCTYPE html>
<html lang="es">
<head>
    <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#9b59b6">
  <link rel="icon" type="image/png" href="https://dummyimage.com/192x192/9b59b6/ffffff.png&text=D">
  <link rel="apple-touch-icon" href="https://dummyimage.com/192x192/9b59b6/ffffff.png&text=D">
</head>
<body>

  <div class="box">
    <h1>Deisy • Mensajes de Bendición</h1>
    <div class="msg-area" id="texto-salida">Toca el botón morado abajo</div>
    
    <div class="btn-row">
      <button id="btn-gen" type="button">Generar respuesta</button>
      <button id="btn-copy" type="button">Copiar texto</button>
    </div>
    
    <div id="feedback">Listo para generar</div>
  </div>

  <script>
    (function() {
      var arrA = ["Amén", "Así es", "Así sea", "Hecho está", "Decretado", "Amén y amén", "Recibido"];
      var arrB = [
        "así será para ti en perfecta armonía",
        "que el universo multiplique cada bendición en tu vida",
        "recibe toda la luz y la prosperidad que mereces",
        "decretado queda con abundancia y paz",
        "abro los caminos para que llegue todo lo bueno",
        "que la gracia divina cubra tu hogar hoy y siempre",
        "que cada una de tus peticiones se manifieste pronto"
      ];
      var arrC = [
        "Bendiciones infinitas",
        "Lluvia de bendiciones para ti y tu familia",
        "Paz y luz para tu alma",
        "Mucha luz en tu camino",
        "Recibe un fuerte abrazo de bendición"
      ];
      var arrD = ["✨🙏", "🙏🕊️", "💫✨", "🌿🙏", "🕯️✨", "🤍🙏", "✨🕊️"];

      function tomar(lista) {
        return lista[Math.floor(Math.random() * lista.length)];
      }

      var pantalla = document.getElementById("texto-salida");
      var aviso = document.getElementById("feedback");
      var botonGenerar = document.getElementById("btn-gen");
      var botonCopiar = document.getElementById("btn-copy");

      function actualizar() {
        var resultado = tomar(arrA) + ", " + tomar(arrB) + ". " + tomar(arrC) + " " + tomar(arrD);
        pantalla.textContent = resultado;
        aviso.textContent = "Nueva respuesta generada";
      }

      botonGenerar.addEventListener("click", actualizar);
      botonGenerar.addEventListener("touchstart", function(e) {
        e.preventDefault();
        actualizar();
      });

      function ejecutarCopia() {
        var texto = pantalla.textContent;
        if (texto.indexOf("Toca el botón") !== -1) return;

        if (navigator.clipboard && navigator.clipboard.writeText) {
          navigator.clipboard.writeText(texto).then(function() {
            aviso.textContent = "✅ ¡Copiado con éxito!";
          }).catch(function() {
            copiaManual(texto);
          });
        } else {
          copiaManual(texto);
        }
      }

      function copiaManual(t) {
        var input = document.createElement("textarea");
        input.value = t;
        input.style.position = "fixed";
        input.style.opacity = "0";
        document.body.appendChild(input);
        input.focus();
        input.select();
        try {
          document.execCommand("copy");
          aviso.textContent = "✅ ¡Copiado con éxito!";
        } catch (err) {
          aviso.textContent = "Selecciona el texto para copiar";
        }
        document.body.removeChild(input);
      }

      botonCopiar.addEventListener("click", ejecutarCopia);
      botonCopiar.addEventListener("touchstart", function(e) {
        e.preventDefault();
        ejecutarCopia();
      });

      // Genera una automáticamente al entrar
      actualizar();
    })();
  </script>
  <script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js');
  }
  </script>
</body>
</html>
