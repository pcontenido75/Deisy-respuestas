<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Deisy • Mensajes de Bendición</title>
  <link rel="manifest" href="manifest.json">
  <link rel="apple-touch-icon" href="icon-192.png">
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background: linear-gradient(135deg, #f0f4ff 0%, #e2e8f0 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .card {
      background: #ffffff;
      width: 100%;
      max-width: 420px;
      border-radius: 24px;
      padding: 26px 20px;
      box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
      text-align: center;
    }
    .header-badge {
      display: inline-block;
      padding: 6px 14px;
      background: #eef2ff;
      color: #4f46e5;
      font-size: 0.85rem;
      font-weight: 700;
      border-radius: 20px;
      letter-spacing: 0.5px;
      margin-bottom: 10px;
      text-transform: uppercase;
    }
    h1 {
      color: #1e293b;
      font-size: 1.4rem;
      margin-bottom: 16px;
      font-weight: 700;
    }
    .mode-pills {
      display: flex;
      gap: 6px;
      margin-bottom: 16px;
      background: #f1f5f9;
      padding: 4px;
      border-radius: 12px;
    }
    .pill {
      flex: 1;
      padding: 8px 4px;
      font-size: 0.78rem;
      font-weight: 600;
      border: none;
      border-radius: 9px;
      background: transparent;
      color: #64748b;
      cursor: pointer;
    }
    .pill.active {
      background: #ffffff;
      color: #4f46e5;
      box-shadow: 0 2px 6px rgba(0,0,0,0.06);
    }
    .quote-box {
      background: #f8fafc;
      border: 1.5px solid #e2e8f0;
      border-radius: 18px;
      padding: 22px 16px;
      min-height: 135px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 18px;
    }
    .quote-text {
      color: #334155;
      font-size: 1.08rem;
      line-height: 1.55;
      font-weight: 500;
    }
    .btn-group {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    button.main-btn {
      width: 100%;
      padding: 15px;
      font-size: 1rem;
      font-weight: 600;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: transform 0.1s ease;
    }
    button.main-btn:active {
      transform: scale(0.98);
    }
    .btn-primary {
      background: #4f46e5;
      color: #ffffff;
      box-shadow: 0 4px 14px rgba(79, 70, 229, 0.28);
    }
    .btn-secondary {
      background: #f1f5f9;
      color: #334155;
    }
    .alert-copied {
      opacity: 0;
      visibility: hidden;
      margin-top: 12px;
      font-size: 0.9rem;
      font-weight: 600;
      color: #16a34a;
      transition: opacity 0.25s ease;
    }
    .alert-copied.visible {
      opacity: 1;
      visibility: visible;
    }
    .counter-info {
      margin-top: 14px;
      font-size: 0.76rem;
      color: #94a3b8;
    }
  </style>
</head>
<body>

  <div class="card">
    <div class="header-badge">Deisy • +15,000 variaciones</div>
    <h1>Mensajes de Bendición</h1>

    <div class="mode-pills">
      <button class="pill active" id="p-mix" onclick="setModo('mix')">Ultra Variado</button>
      <button class="pill" id="p-corto" onclick="setModo('corto')">Cortos</button>
      <button class="pill" id="p-decreto" onclick="setModo('decreto')">Decretos</button>
    </div>

    <div class="quote-box">
      <p id="quote" class="quote-text">Cargando bendición...</p>
    </div>

    <div class="btn-group">
      <button class="main-btn btn-primary" onclick="nuevaFrase()">
        ✨ Nueva Bendición
      </button>
      <button class="main-btn btn-secondary" onclick="copiarTexto()">
        📋 Copiar Mensaje
      </button>
    </div>

    <div id="toast" class="alert-copied">✓ ¡Mensaje copiado!</div>
    <div class="counter-info" id="contador">Historial activo: 0 mensajes únicos</div>
  </div>

  <script>
    let modo = 'mix';
    // Guarda en memoria del teléfono las últimas 500 frases copiadas para no repetir ni de un día para otro
    let historial = JSON.parse(localStorage.getItem('deisy_historial_v3') || '[]');

    const saludos = [
      "Así sea", "Amén", "Recibido con fe", "Un abrazo grande", "Con mucho cariño",
      "Desde el corazón", "Gracias por estar aquí", "Qué bonito leerte", "Mil bendiciones",
      "Gracias por tu buena energía", "Un saludo enorme", "Me alegra mucho leerte",
      "Gracias por conectar", "Totalmente", "Así será", "Qué alegría tenerte por aquí"
    ];

    const deseos = [
      "que cada paso en tu camino se llene de luz",
      "que en tu hogar nunca falte la unión ni la calma",
      "que se abran puertas limpias para tus proyectos",
      "que la abundancia toque tu puerta de maneras inesperadas",
      "que tu camino se despeje de cualquier obstáculo",
      "que el esfuerzo de tus manos se multiplique en bienestar",
      "que la sabiduría guíe siempre tus decisiones",
      "que donde pongas tus pies encuentres respeto y armonía",
      "que este nuevo día te regale certezas bonitas",
      "que la buena energía rodee siempre tu casa",
      "que todo lo que hoy pides con fe se te conceda",
      "que la tranquilidad y la salud acompañen tus días",
      "que vengan tiempos de mucha claridad y avance",
      "que nunca falte el pan ni la alegría en tu mesa",
      "que cada meta que tienes en mente tome forma pronto"
    ];

    const destinatarios = [
      "para ti y toda tu familia",
      "en tu vida y en tu hogar",
      "para ti y los que amas",
      "en cada área de tu vida",
      "para ti y los tuyos",
      "en todo lo que emprendas",
      "en tu casa hoy y siempre",
      "para tu bienestar familiar",
      "en tu caminar diario",
      "para tu paz y prosperidad"
    ];

    const cierresCortos = [
      "Un abrazo fuerte.",
      "Gracias por comentar.",
      "Te mando mucha luz.",
      "Que tengas un día hermoso.",
      "Bendiciones infinitas.",
      "Gracias por tu apoyo.",
      "Un saludo con cariño.",
      "Confía en que viene lo mejor.",
      "Aquí seguimos sumando buena vibra.",
      "Gracias por ser parte de esta comunidad."
    ];

    const iniciosDecreto = [
      "Hecho está:", "Decretado queda:", "Hoy se activa:", "Recibe esta certeza:",
      "Afirma conmigo:", "Declaro hoy:", "Se manifiesta ahora:", "Queda sellado:"
    ];

    const cuerposDecreto = [
      "salud firme, avance constante y armonía completa",
      "prosperidad en tus manos y tranquilidad profunda",
      "protección divina y caminos despejados sin tropiezos",
      "paz, unión y provisión abundante cada día",
      "oportunidades limpias y claridad en cada paso",
      "respaldo en tus proyectos y serenidad en tu alma",
      "abundancia sana y alegría genuina",
      "fuerza para cada reto y bendición multiplicada"
    ];

    const emojisOpcionales = ["", "", "", " ✨", " 🤍", " 🙏", " 🌟", " 💫", " 🌿"];

    function pick(arr) {
      return arr[Math.floor(Math.random() * arr.length)];
    }

    function setModo(nuevoModo) {
      modo = nuevoModo;
      document.getElementById('p-mix').classList.toggle('active', modo === 'mix');
      document.getElementById('p-corto').classList.toggle('active', modo === 'corto');
      document.getElementById('p-decreto').classList.toggle('active', modo === 'decreto');
      nuevaFrase();
    }

    function construirCandidata() {
      let tipo = modo;
      if (modo === 'mix') {
        const r = Math.random();
        if (r < 0.30) tipo = 'corto';
        else if (r < 0.65) tipo = 'bendicion';
        else if (r < 0.85) tipo = 'decreto';
        else tipo = 'inverso';
      }

      const emoji = pick(emojisOpcionales);

      if (tipo === 'corto') {
        // Molde 1: Corto humano (ej. "Amén, gracias por comentar. Un abrazo fuerte.")
        return `${pick(saludos)}, ${pick(cierresCortos).toLowerCase()}${emoji}`;
      }

      if (tipo === 'decreto') {
        // Molde 2: Decreto (ej. "Hecho está: salud firme... para ti y los tuyos.")
        return `${pick(iniciosDecreto)} ${pick(cuerposDecreto)} ${pick(destinatarios)}.${emoji}`;
      }

      if (tipo === 'inverso') {
        // Molde 3: Empieza directo con el deseo y cierra con saludo (cambia la sintaxis)
        const d = pick(deseos);
        const cap = d.charAt(0).toUpperCase() + d.slice(1);
        return `${cap} ${pick(destinatarios)}. ¡${pick(saludos)}!${emoji}`;
      }

      // Molde 4: Clásico combinado (Saludo + deseo + destinatario)
      return `${pick(saludos)}, ${pick(deseos)} ${pick(destinatarios)}.${emoji}`;
    }

    function nuevaFrase() {
      let candidata = "";
      let intentos = 0;

      do {
        candidata = construirCandidata();
        intentos++;
      } while (historial.includes(candidata) && intentos < 50);

      document.getElementById("quote").innerText = candidata;
    }

    async function copiarTexto() {
      const texto = document.getElementById("quote").innerText;
      
      historial.push(texto);
      if (historial.length > 500) historial.shift();
      localStorage.setItem('deisy_historial_v3', JSON.stringify(historial));
      actualizarContador();

      try {
        await navigator.clipboard.writeText(texto);
        mostrarToast();
      } catch (e) {
        const tempInput = document.createElement("textarea");
        tempInput.value = texto;
        document.body.appendChild(tempInput);
        tempInput.select();
        document.execCommand("copy");
        document.body.removeChild(tempInput);
        mostrarToast();
      }
      setTimeout(() => nuevaFrase(), 350);
    }

    function actualizarContador() {
      document.getElementById("contador").innerText = `Historial anti-repetición: ${historial.length} frases únicas`;
    }

    function mostrarToast() {
      const toast = document.getElementById("toast");
      toast.classList.add("visible");
      setTimeout(() => toast.classList.remove("visible"), 1500);
    }

    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('./sw.js').catch(() => {});
      });
    }

    actualizarContador();
    nuevaFrase();
  </script>
</body>
</html>
