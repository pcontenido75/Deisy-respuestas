<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#4f46e5">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>Deisy • Mensajes de Bendición</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">
    <div class="header-badge">Deisy</div>
    <h1>Mensajes de Bendición</h1>

    <div class="quote-box">
      <p id="quote" class="quote-text">Cargando bendición...</p>
    </div>

    <div class="btn-group">
      <button class="btn-primary" onclick="nuevaFrase()">
        ✨ Nueva Bendición
      </button>
      <button class="btn-secondary" onclick="copiarTexto()">
        📋 Copiar Mensaje
      </button>
    </div>

    <div id="toast" class="alert-copied">✓ ¡Copiado con éxito!</div>

    <div class="install-tip">
      <strong>¿Quieres guardarla como app?</strong><br>
      • En <b>iPhone (Safari)</b>: Toca compartir ⎋ y "Agregar al inicio".<br>
      • En <b>Android (Chrome)</b>: Toca ⋮ y "Instalar aplicación" o "Agregar a pantalla principal".
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
